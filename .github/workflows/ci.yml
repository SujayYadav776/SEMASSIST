name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every commit auto-pushes to main (the post-commit hook in scripts/), so a
# newer push supersedes an in-flight run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The pnpm version comes from the `packageManager` field in package.json
      # (pnpm@10.4.1), so CI and local development stay on the same version.
      # Pinned to v5 on purpose: v6 rewrote the installer and now always
      # installs pnpm 11, which does not accept this repo's pnpm 10 lockfile.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Product types
        run: pnpm check:release

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Authenticated function types
        run: deno check --config supabase/functions/deno.json supabase/functions/roadmap-import/index.ts supabase/functions/roadmap-mutate/index.ts supabase/functions/roadmap-account/index.ts

      - name: Production build
        run: pnpm build

      - name: Hosting routes and security headers
        run: node scripts/check-hosting.mjs

      - name: Independent skill and examples
        run: |
          pnpm skill:build
          node dist/skills/semassist/scripts/validate.mjs dist/skills/semassist/examples/beginner-python.json
          node dist/skills/semassist/scripts/validate.mjs dist/skills/semassist/examples/replanned-python.json

      # `pnpm check` (tsc --noEmit) is deliberately not wired in yet: it
      # currently fails on in-progress work in client/src, unrelated to the
      # suite above.
